name: Docs

on:
  push:
    branches: [master]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

env:
  QUARTO_VERSION: "1.10.18"
  # Directory on the gh-pages branch that this build belongs to. Releases are
  # deployed under their tag, everything else is the development version.
  ESPEI_DOCS_VERSION: ${{ github.event_name == 'release' && github.event.release.tag_name || 'dev' }}

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # fetch the entire repo history, required to guarantee setuptools_scm will pick up the tags
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: ${{ env.QUARTO_VERSION }}
      - run: uv sync --dev
      - name: Build API reference
        run: uv run quartodoc build
        working-directory: docs
      - name: Render site
        run: uv run quarto render
        working-directory: docs
      - uses: actions/upload-artifact@v7
        with:
          name: docs-site
          path: docs/_site

  deploy:
    name: Deploy to gh-pages
    needs: build
    if: github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Serialize pushes to the gh-pages branch
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          path: source
      - uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: gh-pages
      - uses: actions/download-artifact@v8
        with:
          name: docs-site
          path: site
      - run: python3 source/docs/_scripts/deploy_version.py --site site --pages gh-pages --version "$ESPEI_DOCS_VERSION"
      - name: Commit and push
        working-directory: gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to deploy"
          else
            git commit -m "Deploy docs for $ESPEI_DOCS_VERSION from ${{ github.sha }}"
            git push
          fi
